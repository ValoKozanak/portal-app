[build]
  command = "npx cross-env CI=false npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"

# redirecty (spracúvajú sa zhora)
[[redirects]]
  from = "/api/*"
  to   = "https://api.client-portal.sk/api-staging/:splat"
  status = 200
  force  = true

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
