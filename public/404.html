<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        // Počet segmentov "base path" (zvyčajne 0 pri Netlify site na koreňovej doméne)
        var pathSegmentsToKeep = 0;
        var l = window.location;

        // Zložíme čistú URL bez čohokoľvek navyše
        var newUrl =
          l.protocol + '//' + l.host + '/' +
          l.pathname.split('/').slice(pathSegmentsToKeep + 1).join('/') +
          l.search + l.hash;

        // SPA fallback -> /index.html
        // Dôležité: nič neprepisujeme (žiadne ~and~, žiadne vlastné escapovanie)
        window.location.replace('/index.html' + (l.search || '') + (l.hash || ''));
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/" />
    </noscript>
  </head>
  <body></body>
</html>
